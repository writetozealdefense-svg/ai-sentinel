# Credentials for Postgres and Neo4j. Values default to the demo password
# `sentinel_dev_pw` (same as the compose path) — production installs MUST
# override via --set secrets.postgresPassword=... --set secrets.neo4jPassword=...
# All consumers read these with env valueFrom/secretKeyRef; the passwords are
# never baked into ConfigMaps or plain env values.
apiVersion: v1
kind: Secret
metadata:
  name: ai-sentinel-secrets
  labels:
    {{- include "ai-sentinel.labels" (dict "root" $ "component" "ai-sentinel-secrets") | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  neo4j-password: {{ .Values.secrets.neo4jPassword | b64enc | quote }}
  # neo4j image wants the combined user/password form
  neo4j-auth: {{ printf "neo4j/%s" .Values.secrets.neo4jPassword | b64enc | quote }}
