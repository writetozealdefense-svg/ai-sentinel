# ---------------------------------------------------------------------------
# redis — single replica on emptyDir: DEMO cluster only, NOT production HA.
#
# securityContext: redis:7-alpine ships user `redis` as uid 999. Root FS is
# read-only; AOF data lives on an emptyDir at /data (fsGroup 999).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  labels:
    {{- include "ai-sentinel.labels" (dict "root" $ "component" "redis") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "ai-sentinel.labels" (dict "root" $ "component" "redis") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ai-sentinel.selectorLabels" (dict "root" $ "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-sentinel.labels" (dict "root" $ "component" "redis") | nindent 8 }}
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      # No service-link env injection: a Service named e.g. "neo4j" would inject
      # NEO4J_PORT_* vars that the neo4j entrypoint fatally misparses as config.
      enableServiceLinks: false
      securityContext:
        {{- include "ai-sentinel.podSecurityContext" (dict "fsGroup" 999) | nindent 8 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          imagePullPolicy: {{ .Values.redis.imagePullPolicy }}
          securityContext:
            {{- include "ai-sentinel.containerSecurityContext" (dict "uid" 999 "readOnlyRootFilesystem" true) | nindent 12 }}
          # Same command as the compose path (AOF persistence on).
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {} # demo only — no persistence across rescheduling
---
apiVersion: v1
kind: Service
metadata:
  # Fixed name to match the compose service DNS name.
  name: redis
  labels:
    {{- include "ai-sentinel.labels" (dict "root" $ "component" "redis") | nindent 4 }}
spec:
  selector:
    {{- include "ai-sentinel.selectorLabels" (dict "root" $ "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
