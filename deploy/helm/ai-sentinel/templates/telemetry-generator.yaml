# ---------------------------------------------------------------------------
# telemetry-generator — Go, distroless static:nonroot (uid 65532), port 8087.
# On the Helm path RUNTIME_MODE=ingest: the internal simulator is OFF and
# falcosidekick (installed separately with the falco chart, typically in the
# `falco` namespace) POSTs real Falco events to
#   http://telemetry-generator.ai-sentinel.svc:8087/runtime/events
# which are normalized to RuntimeEvent with simulated=false.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-generator
  labels:
    {{- include "ai-sentinel.labels" (dict "root" $ "component" "telemetry-generator") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-generator
  labels:
    {{- include "ai-sentinel.labels" (dict "root" $ "component" "telemetry-generator") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-sentinel.selectorLabels" (dict "root" $ "component" "telemetry-generator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-sentinel.labels" (dict "root" $ "component" "telemetry-generator") | nindent 8 }}
    spec:
      serviceAccountName: telemetry-generator
      automountServiceAccountToken: false
      # No service-link env injection: a Service named e.g. "neo4j" would inject
      # NEO4J_PORT_* vars that the neo4j entrypoint fatally misparses as config.
      enableServiceLinks: false
      securityContext:
        {{- include "ai-sentinel.podSecurityContext" (dict) | nindent 8 }}
      containers:
        - name: telemetry-generator
          image: {{ .Values.telemetryGenerator.image }}
          imagePullPolicy: {{ .Values.telemetryGenerator.imagePullPolicy }}
          securityContext:
            {{- include "ai-sentinel.containerSecurityContext" (dict "uid" 65532 "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8087
          env:
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: RUNTIME_MODE
              value: {{ .Values.telemetryGenerator.runtimeMode | quote }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.telemetryGenerator.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  # Fixed name to match the compose service DNS name (http://telemetry-generator:8087).
  name: telemetry-generator
  labels:
    {{- include "ai-sentinel.labels" (dict "root" $ "component" "telemetry-generator") | nindent 4 }}
spec:
  selector:
    {{- include "ai-sentinel.selectorLabels" (dict "root" $ "component" "telemetry-generator") | nindent 4 }}
  ports:
    - name: http
      port: 8087
      targetPort: http
