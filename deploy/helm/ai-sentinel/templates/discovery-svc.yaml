# ---------------------------------------------------------------------------
# discovery-svc — Go, distroless static:nonroot (uid 65532), port 8081.
# Read-only root FS: fully tolerated by the distroless Go binary.
# DATABASE_URL is assembled via Kubernetes env expansion so the password stays
# in the Secret and never appears as a literal in the manifest.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: discovery-svc
  labels:
    {{- include "ai-sentinel.labels" (dict "root" $ "component" "discovery-svc") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-svc
  labels:
    {{- include "ai-sentinel.labels" (dict "root" $ "component" "discovery-svc") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-sentinel.selectorLabels" (dict "root" $ "component" "discovery-svc") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-sentinel.labels" (dict "root" $ "component" "discovery-svc") | nindent 8 }}
    spec:
      serviceAccountName: discovery-svc
      automountServiceAccountToken: false
      # No service-link env injection: a Service named e.g. "neo4j" would inject
      # NEO4J_PORT_* vars that the neo4j entrypoint fatally misparses as config.
      enableServiceLinks: false
      securityContext:
        {{- include "ai-sentinel.podSecurityContext" (dict) | nindent 8 }}
      containers:
        - name: discovery-svc
          image: {{ .Values.discoverySvc.image }}
          imagePullPolicy: {{ .Values.discoverySvc.imagePullPolicy }}
          securityContext:
            {{- include "ai-sentinel.containerSecurityContext" (dict "uid" 65532 "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-sentinel-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@postgres:5432/{{ .Values.postgres.database }}?sslmode=disable"
            - name: NATS_URL
              value: "nats://nats:4222"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.discoverySvc.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  # Fixed name to match the compose service DNS name (http://discovery-svc:8081).
  name: discovery-svc
  labels:
    {{- include "ai-sentinel.labels" (dict "root" $ "component" "discovery-svc") | nindent 4 }}
spec:
  selector:
    {{- include "ai-sentinel.selectorLabels" (dict "root" $ "component" "discovery-svc") | nindent 4 }}
  ports:
    - name: http
      port: 8081
      targetPort: http
