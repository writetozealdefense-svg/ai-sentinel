# ---------------------------------------------------------------------------
# kyverno-policies.yaml — admission-control baseline for namespace ai-sentinel.
#
# Two ClusterPolicies in Enforce mode, adapted from the canonical Kyverno
# policy library (Pod Security Standards):
#   - disallow-privileged-containers:
#       https://kyverno.io/policies/pod-security/baseline/disallow-privileged-containers/
#   - require-run-as-nonroot:
#       https://kyverno.io/policies/pod-security/restricted/require-run-as-nonroot/
#
# IMPORTANT SCOPING: both policies match Pods in namespace `ai-sentinel`
# ONLY. Falco and Tetragon DaemonSets (namespaces `falco` / `kube-system`)
# legitimately require privilege to load eBPF programs, and kube-system
# must never be blocked — so the match is an allowlist of our namespace,
# not a cluster-wide rule with exclusions.
#
# Demo: kubectl apply -f deploy/k8s-tests/bad-pod.yaml  ->  REJECTED.
# ---------------------------------------------------------------------------
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Privileged mode disables most security mechanisms and grants access to
      host devices. This policy blocks any container, init container, or
      ephemeral container in the ai-sentinel namespace that sets
      securityContext.privileged to true.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - ai-sentinel
      validate:
        message: >-
          Privileged mode is disallowed in the ai-sentinel namespace. The fields
          spec.containers[*].securityContext.privileged,
          spec.initContainers[*].securityContext.privileged, and
          spec.ephemeralContainers[*].securityContext.privileged
          must be unset or set to `false`.
        pattern:
          spec:
            =(ephemeralContainers):
              - =(securityContext):
                  =(privileged): "false"
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers must run as a non-root user. This policy requires that
      runAsNonRoot is set to true either at the pod level or on every
      container, init container, and ephemeral container in the
      ai-sentinel namespace.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - ai-sentinel
      validate:
        message: >-
          Running as root is not allowed in the ai-sentinel namespace. Either
          the field spec.securityContext.runAsNonRoot must be set to `true`,
          or the fields spec.containers[*].securityContext.runAsNonRoot,
          spec.initContainers[*].securityContext.runAsNonRoot, and
          spec.ephemeralContainers[*].securityContext.runAsNonRoot must be
          set to `true`.
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: "true"
              =(ephemeralContainers):
                - =(securityContext):
                    =(runAsNonRoot): "true"
              =(initContainers):
                - =(securityContext):
                    =(runAsNonRoot): "true"
              containers:
                - =(securityContext):
                    =(runAsNonRoot): "true"
          - spec:
              =(ephemeralContainers):
                - securityContext:
                    runAsNonRoot: "true"
              =(initContainers):
                - securityContext:
                    runAsNonRoot: "true"
              containers:
                - securityContext:
                    runAsNonRoot: "true"
