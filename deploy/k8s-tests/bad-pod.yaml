# ---------------------------------------------------------------------------
# bad-pod.yaml — THIS POD EXISTS TO BE REJECTED.
#
# It deliberately violates the AI Sentinel runtime-security baseline
# (privileged: true, runAsUser: 0). It is used to demonstrate Kyverno
# admission control in namespace `ai-sentinel`:
#
#   kubectl apply -f deploy/k8s-tests/bad-pod.yaml
#
# Expected result: the API server REJECTS the pod with a Kyverno
# admission-webhook error referencing the `disallow-privileged-containers`
# and `require-run-as-nonroot` ClusterPolicies. If this pod is ever
# admitted, the policies are not enforcing — do NOT "fix" this manifest.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod
  namespace: ai-sentinel
  labels:
    app.kubernetes.io/name: bad-pod
    app.kubernetes.io/part-of: ai-sentinel-demo
spec:
  containers:
    - name: bad
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true   # violation 1: privileged container
        runAsUser: 0       # violation 2: runs as root (runAsNonRoot not set)
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
