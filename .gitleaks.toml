# Gitleaks config — extends the default ruleset.
# Uses the legacy singular [allowlist] table: the plural [[allowlists]] form
# only exists from gitleaks 8.25, and older versions ignore it silently.
[extend]
useDefault = true

# These paths are the product, not leaks: YARA rules that *detect* secrets
# necessarily contain secret-shaped patterns, and the demo fixtures carry
# deliberately fake credentials (AWS documentation example keys etc.) that the
# detection pipeline is supposed to catch on stage.
[allowlist]
description = "detection rules and synthetic demo fixtures"
paths = [
  '''detection-svc/rules/.*''',
  '''fixtures/demo-data/.*''',
]
